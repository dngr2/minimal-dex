name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      # Fast default (legacy) profile: quick build + test.
      - run: forge build
      - run: forge test -vv
      # Production (via-IR) codegen: verify the deployable bytecode builds and passes.
      - run: FOUNDRY_PROFILE=ci forge build
      - run: FOUNDRY_PROFILE=ci forge test -vv
