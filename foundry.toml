# Default (fast) profile: legacy codegen. Compiles ~11.8x faster cold than via-IR and is used
# for local development and testing. The stack-depth sites were refactored to build under legacy.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
via_ir = false
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.invariant]
runs = 64
depth = 200
fail_on_revert = true

# Production / CI profile: via-IR codegen, the deployable bytecode. Build and test with
# `FOUNDRY_PROFILE=ci forge build` / `FOUNDRY_PROFILE=ci forge test`.
[profile.ci]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.ci.invariant]
runs = 64
depth = 200
fail_on_revert = true
